apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: meetups
  name: meetups
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meetups
  strategy:
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: meetups
    spec:
      containers:
      - env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              key: MYSQL_USER
              name: env-secret
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: MYSQL_PASSWORD
              name: env-secret
        - name: DB_DATABASE
          valueFrom:
            secretKeyRef:
              key: MYSQL_DATABASE
              name: env-secret
        envFrom:
        - configMapRef:
            name: env-cfm
        - secretRef:
            name: mail-secret
        - secretRef:
            name: app-key
        image: registry.alexbissessur.dev/meetups:6.56
        imagePullPolicy: IfNotPresent
        name: meetups
        ports:
        - containerPort: 8080
      imagePullSecrets:
      - name: regcred
      initContainers:
      - command:
        - php
        - artisan
        - migrate
        - --force
        env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              key: MYSQL_USER
              name: env-secret
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: MYSQL_PASSWORD
              name: env-secret
        - name: DB_DATABASE
          valueFrom:
            secretKeyRef:
              key: MYSQL_DATABASE
              name: env-secret
        envFrom:
        - configMapRef:
            name: env-cfm
        - secretRef:
            name: app-key
        image: registry.alexbissessur.dev/meetups:6.56
        imagePullPolicy: IfNotPresent
        name: migrate
